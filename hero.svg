  </radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="cloud" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="frame"><rect width="1200" height="320" rx="22"/></clipPath>
  <style>
    .tw { fill:#f6e7b8; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:1 } }
    .halo { transform-origin: 1000px 135px; animation: halo 5.5s ease-in-out infinite; }
    @keyframes halo { 0%,100% { transform: scale(1); opacity:.75 } 50% { transform: scale(1.12); opacity:1 } }
    .cl1 { animation: drift 46s linear infinite; }
    .cl2 { animation: drift 64s linear infinite; animation-delay:-30s; }
    @keyframes drift { from { transform: translateX(-380px) } to { transform: translateX(1320px) } }
    .shoot { stroke:#fff3cf; stroke-width:2; stroke-linecap:round; stroke-dasharray: 0 400; animation: shoot 9s ease-in infinite; animation-delay: 3s; }
    @keyframes shoot { 0%,86% { stroke-dasharray: 0 400; stroke-dashoffset:0; opacity:0 }
      88% { opacity:1 } 96% { stroke-dasharray: 90 400; stroke-dashoffset:-150; opacity:.9 } 100% { stroke-dasharray: 0 400; stroke-dashoffset:-260; opacity:0 } }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</defs>
