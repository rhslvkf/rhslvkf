<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="보름달 FullMoon — 작은 생각을 끝까지 만들어 냅니다">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e1838"/><stop offset="1" stop-color="#080f26"/>
  </linearGradient>
  <radialGradient id="moonFace" cx="42%" cy="38%" r="70%">
    <stop offset="0" stop-color="#fff6d6"/><stop offset=".65" stop-color="#f3dea0"/><stop offset="1" stop-color="#d8bf7c"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
